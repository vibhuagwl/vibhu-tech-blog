<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
<rect width="1600" height="600" fill="#fff"/><text x="800" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Consumer Group Rebalance: What Actually Happens</text>
<g font-family="Arial" font-size="19">
<rect x="60" y="120" width="300" height="120" rx="18" fill="#e8f0fe" stroke="#2b579a" stroke-width="3"/><text x="210" y="160" text-anchor="middle" font-weight="700">Before</text><text x="210" y="195" text-anchor="middle">C1 → P0,P1</text><text x="210" y="220" text-anchor="middle">C2 → P2,P3</text>
<rect x="470" y="120" width="300" height="120" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="620" y="160" text-anchor="middle" font-weight="700">Membership changes</text><text x="620" y="195" text-anchor="middle">C3 joins / C1 dies</text><text x="620" y="220" text-anchor="middle">group coordination starts</text>
<rect x="880" y="120" width="300" height="120" rx="18" fill="#fef3c7" stroke="#b7791f" stroke-width="3"/><text x="1030" y="160" text-anchor="middle" font-weight="700">Assignment</text><text x="1030" y="195" text-anchor="middle">partitions redistributed</text><text x="1030" y="220" text-anchor="middle">ownership changes</text>
<rect x="1290" y="120" width="250" height="120" rx="18" fill="#ecfdf5" stroke="#247a4b" stroke-width="3"/><text x="1415" y="160" text-anchor="middle" font-weight="700">After</text><text x="1415" y="195" text-anchor="middle">C1/C2/C3</text><text x="1415" y="220" text-anchor="middle">new assignments</text>
<g stroke="#334155" stroke-width="4" fill="none"><path d="M360 180h110"/><path d="M770 180h110"/><path d="M1180 180h110"/></g><g fill="#334155"><path d="M470 180l-14-9v18z"/><path d="M880 180l-14-9v18z"/><path d="M1290 180l-14-9v18z"/></g>
<text x="800" y="310" text-anchor="middle" font-size="23" font-weight="700">Why rebalances hurt</text><text x="800" y="350" text-anchor="middle">Consumers can pause processing while ownership is coordinated.</text><text x="800" y="390" text-anchor="middle">Long processing + small max.poll.interval.ms can look like a dead consumer.</text><text x="800" y="430" text-anchor="middle">Use cooperative assignment and stable membership where appropriate.</text><text x="800" y="470" text-anchor="middle" font-weight="700">Architect rule: treat rebalance rate as an operational metric, not just a Kafka event.</text>
</g></svg>