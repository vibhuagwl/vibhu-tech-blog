<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
<rect width="1600" height="560" fill="#fff"/><text x="800" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Kafka Replication, ISR and Acks</text>
<g font-family="Arial" font-size="20">
<rect x="60" y="120" width="400" height="300" rx="20" fill="#ecfdf5" stroke="#247a4b" stroke-width="3"/><text x="260" y="160" text-anchor="middle" font-weight="700">Broker 1 — Leader</text><text x="260" y="200" text-anchor="middle">P0: 100 101 102 103</text><text x="260" y="245" text-anchor="middle">accepts produce + fetch</text><text x="260" y="285" text-anchor="middle">replication position = 103</text><text x="260" y="340" text-anchor="middle">acks=all waits for ISR</text>
<rect x="600" y="120" width="400" height="300" rx="20" fill="#e8f0fe" stroke="#2b579a" stroke-width="3"/><text x="800" y="160" text-anchor="middle" font-weight="700">Broker 2 — Follower</text><text x="800" y="200" text-anchor="middle">P0: 100 101 102 103</text><text x="800" y="245" text-anchor="middle">fetches from leader</text><text x="800" y="285" text-anchor="middle">in-sync with leader</text><text x="800" y="340" text-anchor="middle">member of ISR</text>
<rect x="1140" y="120" width="400" height="300" rx="20" fill="#f3e8ff" stroke="#6b46c1" stroke-width="3"/><text x="1340" y="160" text-anchor="middle" font-weight="700">Broker 3 — Follower</text><text x="1340" y="200" text-anchor="middle">P0: 100 101</text><text x="1340" y="245" text-anchor="middle">replication is behind</text><text x="1340" y="285" text-anchor="middle">may leave ISR</text><text x="1340" y="340" text-anchor="middle">catch up → rejoin ISR</text>
<g stroke="#334155" stroke-width="4" fill="none"><path d="M460 240h140"/><path d="M1000 240h140"/></g><g fill="#334155"><path d="M600 240l-15-10v20z"/><path d="M1140 240l-15-10v20z"/></g>
<text x="800" y="480" text-anchor="middle" font-weight="700">Key distinction</text><text x="800" y="515" text-anchor="middle">Replication factor ≠ number of active consumers. ISR determines which replicas can participate in durable acknowledgement.</text>
</g></svg>