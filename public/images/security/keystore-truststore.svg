<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Keystore vs truststore">
  <rect width="720" height="320" fill="#fff"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#0f172a">Keystore vs Truststore</text>
  <rect x="40" y="50" width="300" height="220" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="190" y="78" text-anchor="middle" font-weight="600" fill="#065f46">SERVICE A — KEYSTORE</text>
  <text x="60" y="110" font-size="13" fill="#334155">• Private key (secret)</text>
  <text x="60" y="135" font-size="13" fill="#334155">• Server certificate</text>
  <text x="60" y="160" font-size="13" fill="#334155">• Certificate chain</text>
  <text x="60" y="200" font-size="12" font-weight="600" fill="#047857">"What identity do I present?"</text>
  <rect x="380" y="50" width="300" height="220" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="530" y="78" text-anchor="middle" font-weight="600" fill="#1e40af">SERVICE B — TRUSTSTORE</text>
  <text x="400" y="110" font-size="13" fill="#334155">• CA certificates</text>
  <text x="400" y="135" font-size="13" fill="#334155">• Trusted peer certs</text>
  <text x="400" y="160" font-size="13" fill="#334155">• No private key</text>
  <text x="400" y="200" font-size="12" font-weight="600" fill="#1d4ed8">"Whom do I trust?"</text>
  <text x="360" y="295" text-anchor="middle" font-size="12" fill="#64748b">One-way TLS: server keystore + client truststore · mTLS: both sides need both</text>
</svg>
