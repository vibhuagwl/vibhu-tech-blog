server:
  port: 0

app:
  resource-base-url: http://localhost:8089

spring:
  security:
    oauth2:
      client:
        registration:
          idanywhere:
            provider: idanywhere
            client-id: payments-web
            client-secret: payments-web-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile
        provider:
          idanywhere:
            authorization-uri: http://localhost:9080/oauth2/authorize
            token-uri: http://localhost:9080/oauth2/token
            jwk-set-uri: http://localhost:9080/oauth2/jwks
            user-info-uri: http://localhost:9080/userinfo
            user-name-attribute: sub
