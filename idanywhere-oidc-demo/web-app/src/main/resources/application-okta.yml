# Activate: --spring.profiles.active=okta
# Overrides the same registration id "idanywhere" so controllers/templates stay unchanged.
# Create an Okta OIDC Web app; redirect URI:
#   http://localhost:8088/login/oauth2/code/idanywhere
spring:
  security:
    oauth2:
      client:
        registration:
          idanywhere:
            client-id: ${OKTA_CLIENT_ID}
            client-secret: ${OKTA_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email,groups
            provider: idanywhere
        provider:
          idanywhere:
            # Example: https://dev-123456.okta.com/oauth2/default
            issuer-uri: ${OKTA_ISSUER_URI}

app:
  resource-base-url: ${PAYMENTS_API_BASE:http://localhost:8089}
