server:
  port: 8089

spring:
  application:
    name: idanywhere-resource-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9080
          audiences: api://payments-api

---
# Real IDAnywhere / ADFS: --spring.profiles.active=idanywhere
spring:
  config:
    activate:
      on-profile: idanywhere
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDA_ISSUER_URI:https://idanywhere.example.com/adfs}
          audiences: ${IDA_API_AUDIENCE:api://payments-api}

---
# Okta: --spring.profiles.active=okta
spring:
  config:
    activate:
      on-profile: okta
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OKTA_ISSUER_URI}
          audiences: ${OKTA_API_AUDIENCE:api://payments-api}

---
# Keycloak: --spring.profiles.active=keycloak
spring:
  config:
    activate:
      on-profile: keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          audiences: ${KEYCLOAK_API_AUDIENCE:account}
