server:
  port: 9080

spring:
  application:
    name: idanywhere-idp-standin
  datasource:
    url: jdbc:h2:mem:idanywhere;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  # Local stand-in issuer. Production IDAnywhere looks like https://idanywhere.<env>/...
  issuer: http://localhost:9080
  access-token-ttl: PT15M
