server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:paymentops-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: long-enough-demo-secret-key-for-hs256-must-be-32bytes!!
  expiration-ms: 86400000

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  rate-limit:
    requests-per-minute: 10000
  seed:
    enabled: true
