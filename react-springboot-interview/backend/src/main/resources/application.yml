server:
  port: 8080

spring:
  application:
    name: payment-ops
  datasource:
    url: jdbc:h2:mem:paymentops;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: long-enough-demo-secret-key-for-hs256-must-be-32bytes!!
  expiration-ms: 86400000

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  rate-limit:
    requests-per-minute: 120
  seed:
    enabled: true

logging:
  level:
    com.example.payment: INFO
