services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_ops
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5432:5432"
    volumes:
      - poi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  poi_pg:
