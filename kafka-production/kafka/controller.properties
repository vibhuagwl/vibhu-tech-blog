# =============================================================================
# Dedicated KRaft Controller node (optional split — production often combined)
# Node 4 — controller-only (no client traffic)
# =============================================================================

process.roles=controller
node.id=4
controller.quorum.voters=1@kafka1.internal:9095,2@kafka2.internal:9095,3@kafka3.internal:9095

listeners=CONTROLLER://0.0.0.0:9095
advertised.listeners=CONTROLLER://kafka-ctrl1.internal:9095
listener.security.protocol.map=CONTROLLER:SSL
controller.listener.names=CONTROLLER

ssl.keystore.location=/var/lib/kafka/secrets/controller.keystore.jks
ssl.keystore.password=${KAFKA_KEYSTORE_PASSWORD}
ssl.key.password=${KAFKA_KEY_PASSWORD}
ssl.truststore.location=/var/lib/kafka/secrets/controller.truststore.jks
ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
ssl.enabled.protocols=TLSv1.2,TLSv1.3

# Controllers must NOT accept client Produce/Fetch — only quorum traffic
