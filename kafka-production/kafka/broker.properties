# =============================================================================
# Kafka Broker — Production (KRaft combined broker+controller node example)
# Node 1 of 3 — AZ-1 (kafka1.internal)
# NEVER commit secrets — use env substitution or Secrets Manager at deploy time
# =============================================================================

# --- KRaft identity ---
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka1.internal:9095,2@kafka2.internal:9095,3@kafka3.internal:9095

# --- Listeners (CLIENT / BROKER / CONTROLLER) ---
# CLIENT: external apps (SASL_SSL + TLS)
# BROKER: inter-broker replication (SSL)
# CONTROLLER: KRaft quorum (SSL — never expose to clients)
listeners=CLIENT://0.0.0.0:9093,BROKER://0.0.0.0:9094,CONTROLLER://0.0.0.0:9095
advertised.listeners=CLIENT://kafka1.internal:9093,BROKER://kafka1.internal:9094
listener.security.protocol.map=CLIENT:SASL_SSL,BROKER:SSL,CONTROLLER:SSL
inter.broker.listener.name=BROKER
controller.listener.names=CONTROLLER

# --- TLS (all listeners) ---
ssl.keystore.location=/var/lib/kafka/secrets/broker.keystore.jks
ssl.keystore.password=${KAFKA_KEYSTORE_PASSWORD}
ssl.key.password=${KAFKA_KEY_PASSWORD}
ssl.truststore.location=/var/lib/kafka/secrets/broker.truststore.jks
ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
ssl.client.auth=requested
ssl.enabled.protocols=TLSv1.2,TLSv1.3
ssl.endpoint.identification.algorithm=https

# --- SASL (CLIENT listener — SCRAM for service accounts) ---
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=PLAIN
security.inter.broker.protocol=SSL

# Authorizer
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:admin

# --- Durability (FinTech baseline) ---
default.replication.factor=3
min.insync.replicas=2
unclean.leader.election.enable=false
auto.create.topics.enable=false
delete.topic.enable=false

# --- Log / retention ---
num.partitions=12
log.dirs=/var/lib/kafka/data
log.retention.hours=168
log.retention.bytes=-1
log.segment.bytes=1073741824
log.cleanup.policy=delete
compression.type=producer

# --- Performance / JVM heap set via KAFKA_HEAP_OPTS env ---
num.network.threads=8
num.io.threads=16
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
replica.fetch.max.bytes=1048576
message.max.bytes=2097152

# --- Transaction log (EOS producers) ---
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

# --- Offsets topic ---
offsets.topic.replication.factor=3
offsets.topic.num.partitions=50

# --- Monitoring / audit ---
metric.reporters=org.apache.kafka.common.metrics.JmxReporter
authorizer.log.enable=true
