# =============================================================================
# Kafka Admin / CLI client (bastion / CI only — NOT deployed to app pods)
# =============================================================================

bootstrap.servers=kafka1.internal:9093,kafka2.internal:9093,kafka3.internal:9093

security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="${KAFKA_ADMIN_SCRAM_PASSWORD}";

ssl.truststore.location=/etc/kafka/truststore.jks
ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
ssl.endpoint.identification.algorithm=https

# Optional mTLS for admin (high security):
# ssl.keystore.location=/etc/kafka/admin.keystore.jks
# ssl.keystore.password=${KAFKA_ADMIN_KEYSTORE_PASSWORD}
# ssl.key.password=${KAFKA_ADMIN_KEY_PASSWORD}
