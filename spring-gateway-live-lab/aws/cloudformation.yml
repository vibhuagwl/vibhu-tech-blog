# ECS Fargate + public ALB + Cloud Map (no Eureka).
# Discovery = AWS Cloud Map DNS (*.gateway-lab.local).
#
# Prerequisites:
#   - VPC with 2 public subnets
#   - Images already in ECR (see scripts/build-push-ecr.sh)
#
# Deploy:
#   aws cloudformation deploy \
#     --stack-name gateway-live-lab \
#     --template-file aws/cloudformation.yml \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides \
#       VpcId=vpc-xxx \
#       PublicSubnetIds=subnet-a,subnet-b \
#       ApiGatewayImage=123.dkr.ecr.us-east-1.amazonaws.com/gateway-lab/api-gateway:latest \
#       UserServiceImage=123.dkr.ecr.us-east-1.amazonaws.com/gateway-lab/user-service:latest \
#       OrderServiceImage=123.dkr.ecr.us-east-1.amazonaws.com/gateway-lab/order-service:latest

AWSTemplateFormatVersion: "2010-09-09"
Description: Gateway live lab — ECS Fargate, ALB edge, Cloud Map discovery (no Eureka)

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ApiGatewayImage:
    Type: String
  UserServiceImage:
    Type: String
  OrderServiceImage:
    Type: String
  DesiredCount:
    Type: Number
    Default: 2
  ContainerCpu:
    Type: Number
    Default: 256
  ContainerMemory:
    Type: Number
    Default: 512

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: gateway-live-lab

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/gateway-live-lab
      RetentionInDays: 14

  CloudMapNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: gateway-lab.local
      Vpc: !Ref VpcId

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gateway-live-lab-ecs-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ALB for api-gateway
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ServiceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks (gateway + user + order)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8082
          SourceSecurityGroupId: !Ref AlbSg
        - IpProtocol: tcp
          FromPort: 8081
          ToPort: 8082
          SourceSecurityGroupId: !Ref ServiceSg
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  PublicAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: gateway-live-lab-alb
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSg

  GatewayTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: gateway-live-lab-gw
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PublicAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GatewayTargetGroup

  UserDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: user-service
      DnsConfig:
        NamespaceId: !Ref CloudMapNamespace
        DnsRecords:
          - Type: A
            TTL: 5
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  OrderDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: order-service
      DnsConfig:
        NamespaceId: !Ref CloudMapNamespace
        DnsRecords:
          - Type: A
            TTL: 5
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  UserTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: gateway-lab-user
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: user-service
          Image: !Ref UserServiceImage
          Essential: true
          PortMappings:
            - ContainerPort: 8081
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: aws
            - Name: SERVER_PORT
              Value: "8081"
            - Name: INSTANCE_ID
              Value: user-ecs
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: user

  OrderTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: gateway-lab-order
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: order-service
          Image: !Ref OrderServiceImage
          Essential: true
          PortMappings:
            - ContainerPort: 8082
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: aws
            - Name: SERVER_PORT
              Value: "8082"
            - Name: INSTANCE_ID
              Value: order-ecs
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: order

  GatewayTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: gateway-lab-api-gateway
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: api-gateway
          Image: !Ref ApiGatewayImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: aws
            - Name: SERVER_PORT
              Value: "8080"
            # Cloud Map DNS — AWS LB across task IPs at DNS layer (MULTIVALUE)
            - Name: USER_SERVICE_URI
              Value: http://user-service.gateway-lab.local:8081
            - Name: ORDER_SERVICE_URI
              Value: http://order-service.gateway-lab.local:8082
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gateway

  UserService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: user-service
      Cluster: !Ref Cluster
      TaskDefinition: !Ref UserTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref ServiceSg
      ServiceRegistries:
        - RegistryArn: !GetAtt UserDiscoveryService.Arn

  OrderService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: order-service
      Cluster: !Ref Cluster
      TaskDefinition: !Ref OrderTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref ServiceSg
      ServiceRegistries:
        - RegistryArn: !GetAtt OrderDiscoveryService.Arn

  GatewayService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
      - UserService
      - OrderService
    Properties:
      ServiceName: api-gateway
      Cluster: !Ref Cluster
      TaskDefinition: !Ref GatewayTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref ServiceSg
      LoadBalancers:
        - ContainerName: api-gateway
          ContainerPort: 8080
          TargetGroupArn: !Ref GatewayTargetGroup

Outputs:
  AlbDnsName:
    Description: Hit http://<this>/api/users/101
    Value: !GetAtt PublicAlb.DNSName
  UserServiceDns:
    Value: user-service.gateway-lab.local
  OrderServiceDns:
    Value: order-service.gateway-lab.local
  ClusterName:
    Value: !Ref Cluster
