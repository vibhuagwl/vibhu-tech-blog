# Production AWS profile — graceful shutdown + conservative Tomcat timeouts
server:
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
    threads:
      max: 200

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
