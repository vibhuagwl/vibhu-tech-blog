server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: order-service
  datasource:
    url: ${ORDERS_DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:flash}
    password: ${DB_PASSWORD:flash}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
    listener:
      ack-mode: MANUAL
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
