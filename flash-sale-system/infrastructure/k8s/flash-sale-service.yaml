apiVersion: apps/v1
kind: Deployment
metadata:
  name: flash-sale-service
spec:
  replicas: 4
  selector:
    matchLabels: { app: flash-sale }
  template:
    metadata:
      labels: { app: flash-sale }
    spec:
      containers:
        - name: app
          image: flash-sale-service:1.0.0
          ports: [ { containerPort: 8082 } ]
          envFrom:
            - secretRef: { name: flash-sale-secrets }
            - configMapRef: { name: flash-sale-config }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flash-sale
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: flash-sale-service }
  minReplicas: 4
  maxReplicas: 40
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: inventory }
