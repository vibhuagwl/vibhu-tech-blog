server:
  port: ${SERVER_PORT:8082}
spring:
  profiles:
    default: local
  application:
    name: flash-sale-service
  datasource:
    url: ${FLASHSALE_DB_URL:jdbc:postgresql://localhost:5432/flashsale}
    username: ${DB_USER:flash}
    password: ${DB_PASSWORD:flash}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 2000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: flash-sale-service
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: MANUAL
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8080/realms/flash-sale}
resilience4j:
  circuitbreaker:
    instances:
      redis:
        failure-rate-threshold: 50
        sliding-window-size: 20
        wait-duration-in-open-state: 5s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 5
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
