# Optional backup reminder — does NOT run the AI agent.
# Primary scheduler: Cursor Automation (see job-search-agent/SETUP.md)
#
# Enable by ensuring GitHub Actions are on for this repo.
# Creates a daily issue reminder at 02:30 UTC (08:00 IST).

name: Daily Job Search Reminder

on:
  schedule:
    # 08:00 IST = 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily job search — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              '## Vibhu Daily Job Search',
              '',
              'This is a **backup reminder** only.',
              '',
              '1. Confirm Cursor Automation **Vibhu Daily Job Search** ran: https://cursor.com/agents',
              '2. Or run manually with prompt from `job-search-agent/AUTOMATION_PROMPT.md`',
              '3. Check digest under `job-search-agent/digests/`',
              '',
              'Primary setup: `job-search-agent/SETUP.md`',
            ].join('\n');

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'job-search-daily',
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'job-search-daily',
                  color: '0E8A16',
                  description: 'Daily Vibhu job-search agent reminder',
                });
              } else {
                throw e;
              }
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'job-search-daily',
              per_page: 10,
            });

            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              core.info(`Issue already exists: ${existing.html_url}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['job-search-daily'],
            });
            core.info(`Created ${created.data.html_url}`);
