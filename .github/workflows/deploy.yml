name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Fail on merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.yml' '*.yaml' '*.json' ':!.github/workflows/deploy.yml'; then
            echo 'Merge conflict markers found in source; refusing to deploy.'
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Keep GitHub Pages from running Jekyll on the export
        run: touch out/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Stop "Deploy from branch" / Jekyll from overwriting the Next.js export.
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
