server:
  port: 8093

spring:
  application:
    name: kafka-mcp-server
  ai:
    mcp:
      server:
        name: kafka-mcp-server
        version: 1.0.0
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp

app:
  mcp:
    security:
      enabled: false
    api-key: dev-mcp-key

management:
  endpoints:
    web:
      exposure:
        include: health,info
