version: "3.9"

# Default local run uses in-memory domain + RAG — no external infra required.
# Start optional services when integrating persistence, cache, or event replay.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aifp
      POSTGRES_USER: aifp
      POSTGRES_PASSWORD: aifp
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
