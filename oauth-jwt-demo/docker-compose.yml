services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oauth
      POSTGRES_USER: oauth
      POSTGRES_PASSWORD: oauth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth -d oauth"]
      interval: 5s
      timeout: 5s
      retries: 10

  authorization-server:
    build: ./authorization-server
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oauth
      SPRING_DATASOURCE_USERNAME: oauth
      SPRING_DATASOURCE_PASSWORD: oauth
      APP_ISSUER: http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy

  resource-server:
    build: ./resource-server
    ports:
      - "8081:8081"
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://authorization-server:9000
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTH_SERVER_TOKEN_URI: http://authorization-server:9000/oauth2/token
      # Audience validation still expects tokens from local issuer; for docker demos prefer host issuer
      APP_AUDIENCE: payment-api
    depends_on:
      - authorization-server

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://authorization-server:9000
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: payments
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://resource-server:8081
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/**
    depends_on:
      - resource-server
      - authorization-server
