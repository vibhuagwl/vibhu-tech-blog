server:
  port: 8090

spring:
  application:
    name: payment-investigator
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  datasource:
    url: jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: payment-investigator
      auto-offset-reset: earliest

app:
  ai:
    provider: scripted
  rag:
    seed-enabled: true
    docs-pattern: classpath:docs/*.md
    fail-on-empty: true
    top-k: 3
    similarity-threshold: 0.0
  harness:
    max-tool-calls: 10
    max-model-iterations: 5
    wall-clock-ms: 30000
    context-budget-chars: 8000
  kafka:
    enabled: false
    topic: payments.failed
  skills:
    enabled: true
    location: classpath:skills/payment-investigation
    fail-on-missing: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
