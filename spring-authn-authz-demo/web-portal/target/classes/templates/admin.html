<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Admin</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
  <main>
    <h1>Admin — all payments</h1>
    <p><a th:href="@{/payments}">Back</a>
      · <form th:action="@{/logout}" method="post" style="display:inline"><button type="submit">Logout</button></form>
    </p>
    <table>
      <thead><tr><th>ID</th><th>Owner</th><th>Amount</th><th>Note</th></tr></thead>
      <tbody>
        <tr th:each="p : ${payments}">
          <td th:text="${p.id()}"></td>
          <td th:text="${p.owner()}"></td>
          <td th:text="${p.amount()}"></td>
          <td th:text="${p.note()}"></td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
