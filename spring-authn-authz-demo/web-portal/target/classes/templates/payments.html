<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>Payments</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
  <main>
    <header>
      <h1>Payments</h1>
      <p>Signed in as <strong th:text="${username}">user</strong>
        <span sec:authorize="hasRole('ADMIN')"> · <a th:href="@{/admin}">Admin</a></span>
        · <form th:action="@{/logout}" method="post" style="display:inline"><button type="submit">Logout</button></form>
      </p>
    </header>

    <form th:action="@{/payments}" method="post" class="card">
      <h2>Create payment</h2>
      <label>Amount <input type="number" step="0.01" name="amount" required/></label>
      <label>Note <input type="text" name="note"/></label>
      <button type="submit">Create</button>
    </form>

    <h2>Your payments</h2>
    <table>
      <thead><tr><th>ID</th><th>Amount</th><th>Note</th></tr></thead>
      <tbody>
        <tr th:each="p : ${payments}">
          <td th:text="${p.id()}"></td>
          <td th:text="${p.amount()}"></td>
          <td th:text="${p.note()}"></td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
