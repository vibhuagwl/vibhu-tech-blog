# KRaft combined broker+controller. Production still separates controller quorum.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9094
controller.listener.names=CONTROLLER
listeners=SASL_SSL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
advertised.listeners=SASL_SSL://localhost:9093
listener.security.protocol.map=SASL_SSL:SASL_SSL,CONTROLLER:SASL_SSL
inter.broker.listener.name=SASL_SSL
sasl.enabled.mechanisms=OAUTHBEARER
sasl.mechanism.inter.broker.protocol=OAUTHBEARER
ssl.keystore.location=/etc/kafka/certs/kafka.broker.keystore.p12
ssl.keystore.password=${KAFKA_KEYSTORE_PASSWORD}
ssl.key.password=${KAFKA_KEY_PASSWORD}
ssl.keystore.type=PKCS12
ssl.truststore.location=/etc/kafka/certs/kafka.truststore.p12
ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
ssl.truststore.type=PKCS12
ssl.client.auth=none
ssl.endpoint.identification.algorithm=HTTPS
# Client → broker: validate JWT via JWKS (not Spring Security Resource Server).
listener.name.sasl_ssl.sasl.enabled.mechanisms=OAUTHBEARER
listener.name.sasl_ssl.oauthbearer.sasl.server.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler
listener.name.sasl_ssl.oauthbearer.sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
listener.name.sasl_ssl.oauthbearer.sasl.oauthbearer.jwks.endpoint.url=${OAUTH_JWKS_ENDPOINT}
listener.name.sasl_ssl.oauthbearer.sasl.oauthbearer.token.endpoint.url=${OAUTH_TOKEN_ENDPOINT}
listener.name.sasl_ssl.oauthbearer.sasl.oauthbearer.expected.issuer=${OAUTH_ISSUER_URI}
listener.name.sasl_ssl.oauthbearer.sasl.oauthbearer.expected.audience=kafka
listener.name.sasl_ssl.oauthbearer.sasl.oauthbearer.sub.claim.name=${OAUTH_PRINCIPAL_CLAIM}
listener.name.sasl_ssl.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="${KAFKA_BROKER_CLIENT_ID}" clientSecret="${KAFKA_BROKER_CLIENT_SECRET}" scope="kafka";
# Controller listener uses the same identity for the KRaft quorum.
listener.name.controller.sasl.enabled.mechanisms=OAUTHBEARER
listener.name.controller.oauthbearer.sasl.server.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler
listener.name.controller.oauthbearer.sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
listener.name.controller.oauthbearer.sasl.oauthbearer.jwks.endpoint.url=${OAUTH_JWKS_ENDPOINT}
listener.name.controller.oauthbearer.sasl.oauthbearer.token.endpoint.url=${OAUTH_TOKEN_ENDPOINT}
listener.name.controller.oauthbearer.sasl.oauthbearer.expected.issuer=${OAUTH_ISSUER_URI}
listener.name.controller.oauthbearer.sasl.oauthbearer.expected.audience=kafka
listener.name.controller.oauthbearer.sasl.oauthbearer.sub.claim.name=${OAUTH_PRINCIPAL_CLAIM}
listener.name.controller.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="${KAFKA_BROKER_CLIENT_ID}" clientSecret="${KAFKA_BROKER_CLIENT_SECRET}" scope="kafka";
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:kafka-broker
allow.everyone.if.no.acl.found=false
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
auto.create.topics.enable=false
log.dirs=/tmp/kraft-combined-logs
