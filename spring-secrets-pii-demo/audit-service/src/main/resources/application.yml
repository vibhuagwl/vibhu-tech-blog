server:
  port: 8087

spring:
  application:
    name: audit-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Required env: DB_PASSWORD, SERVICE_CLIENT_PASSWORD, COMPLIANCE_PASSWORD
