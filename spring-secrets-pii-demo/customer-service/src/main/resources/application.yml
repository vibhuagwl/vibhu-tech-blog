server:
  port: 8085

spring:
  application:
    name: customer-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# NEVER put real secrets here — inject via K8s Secret / AWS SM / Vault → env
# Required env: DB_PASSWORD, PII_ENCRYPTION_KEY, SERVICE_CLIENT_PASSWORD
