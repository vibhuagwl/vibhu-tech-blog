# Production profile: fail fast if secrets/DB are missing. No local HMAC default.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate

security:
  jwt:
    secret: ${JWT_SECRET}
    previous-secret: ${JWT_PREVIOUS_SECRET:}
    secret-source: env
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  port: ${PORT:8092}

# Prefer HTTPS at the load balancer / ingress. The app should still
# honor X-Forwarded-Proto when behind a reverse proxy:
server.forward-headers-strategy: framework
