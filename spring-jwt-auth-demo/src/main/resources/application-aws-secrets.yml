# Activate with --spring.profiles.active=prod,aws-secrets
# Fetches HMAC material from AWS Secrets Manager at startup (see AwsSecretsManagerJwtSecretProvider).
# Preferred on ECS/EKS is still: map the secret to env JWT_SECRET (no SDK in the JVM).
security:
  jwt:
    secret-source: aws
    aws-secret-id: ${JWT_AWS_SECRET_ID}
    aws-region: ${AWS_REGION:us-east-1}
