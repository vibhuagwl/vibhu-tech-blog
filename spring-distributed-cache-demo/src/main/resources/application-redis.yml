# Activate: --spring.profiles.active=redis
spring:
  config:
    activate:
      on-profile: redis
  autoconfigure:
    exclude: []
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16

app:
  cache:
    redis-enabled: true
