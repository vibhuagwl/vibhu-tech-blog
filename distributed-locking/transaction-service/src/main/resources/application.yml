server:
  port: 8083

spring:
  application:
    name: transaction-service
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:postgresql://localhost:5432/transactiondb}
    username: ${TRANSACTION_DB_USERNAME:postgres}
    password: ${TRANSACTION_DB_PASSWORD:postgres}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 1500
        request.timeout.ms: 1500
        delivery.timeout.ms: 3000
        retries: 1
    admin:
      fail-fast: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

distributed-locking:
  lock-service-url: ${LOCK_SERVICE_URL:http://localhost:8081}
  account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
  lock-ttl-millis: ${LOCK_TTL_MILLIS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
