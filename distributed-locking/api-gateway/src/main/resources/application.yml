server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 60s
      routes:
        - id: transfers
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/transfers/**
        - id: accounts
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/accounts/**
        - id: recovery
          uri: ${RECOVERY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/recovery/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
