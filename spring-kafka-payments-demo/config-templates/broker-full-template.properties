# Single node demo defaults for local tests
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
advertised.listeners=PLAINTEXT://localhost:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
controller.listener.names=CONTROLLER

# Topic defaults
num.partitions=6
default.replication.factor=1
min.insync.replicas=1
auto.create.topics.enable=false
delete.topic.enable=true

# Durability / log
log.retention.hours=168
log.retention.bytes=-1
log.segment.bytes=1073741824
log.segment.ms=604800000
log.cleanup.policy=delete

# Throughput / message size
message.max.bytes=2097152
replica.fetch.max.bytes=2097152
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
num.network.threads=3
num.io.threads=8
queued.max.requests=500

# Consumer group / offsets
offsets.topic.num.partitions=50
offsets.topic.replication.factor=1
offsets.retention.minutes=10080
group.initial.rebalance.delay.ms=3000

# Transaction state (needed for EOS producers)
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
transaction.max.timeout.ms=900000

# Leader / replica behavior
unclean.leader.election.enable=false
replica.lag.time.max.ms=30000
replica.socket.timeout.ms=30000

# Connection hygiene
connections.max.idle.ms=600000
log.cleaner.enable=true

# Security placeholders (prod cluster)
# listeners=SASL_SSL://:9092,CONTROLLER://:9093
# security.inter.broker.protocol=SASL_SSL
# sasl.enabled.mechanisms=SCRAM-SHA-512
# ssl.client.auth=required
# authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
