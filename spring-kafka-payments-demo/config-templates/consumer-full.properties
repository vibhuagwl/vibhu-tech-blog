bootstrap.servers=localhost:9092
group.id=settlement-worker
client.id=settlement-worker-1

# Deserialization
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.json.trusted.packages=com.vibhu.kafka.common
spring.json.value.default.type=com.vibhu.kafka.common.PaymentMessages$PaymentRequestedEvent

# Offset + delivery
enable.auto.commit=false
auto.offset.reset=earliest
isolation.level=read_committed

# Poll / heartbeat / rebalance
max.poll.records=200
max.poll.interval.ms=300000
session.timeout.ms=45000
heartbeat.interval.ms=15000
partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

# Fetch tuning
fetch.min.bytes=1
fetch.max.wait.ms=500
max.partition.fetch.bytes=1048576
fetch.max.bytes=52428800

# Commit / retries / reconnect
default.api.timeout.ms=60000
request.timeout.ms=30000
retry.backoff.ms=100
retry.backoff.max.ms=1000
reconnect.backoff.ms=50
reconnect.backoff.max.ms=1000
connections.max.idle.ms=540000

# Topic creation behavior
allow.auto.create.topics=false

# Security placeholders (prod)
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
# sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="..." password="...";
# ssl.truststore.location=/etc/certs/truststore.jks
# ssl.truststore.password=changeit
