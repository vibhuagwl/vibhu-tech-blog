server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - name: CircuitBreaker
          args:
            name: gatewayDefault
            fallbackUri: forward:/fallback
      routes:
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderRoute
        - id: payment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/payments/**
        - id: customer-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/customers/**
        - id: inventory-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/inventory/**
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**

resilience4j:
  circuitbreaker:
    instances:
      gatewayDefault:
        sliding-window-size: 10
        failure-rate-threshold: 50
      orderRoute:
        sliding-window-size: 10
        failure-rate-threshold: 50
  timelimiter:
    instances:
      gatewayDefault:
        timeout-duration: 3s
      orderRoute:
        timeout-duration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
