server:
  port: 8083

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/customers
    username: msp
    password: msp
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: localhost
      port: 6379

msp:
  cache:
    ttl-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [cid=%X{correlationId}] - %msg%n"
