spring:
  application:
    name: spring-microservices-patterns-lab
  datasource:
    url: jdbc:h2:mem:msplab;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: msp-lab
    listener:
      auto-startup: false

msp:
  lab:
  strangler:
    new-service-percent: 50
  outbox:
    relay-interval-ms: 1000
  snowflake:
    worker-id: 1
    datacenter-id: 1
  kafka:
    enabled: false
    order-topic: order-created

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

server:
  port: 8095

logging:
  level:
    com.vibhu.msp: INFO
